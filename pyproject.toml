[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-masking"
version = "0.1.0"
description = "Reproducible acoustic keystroke masking experiments"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3", "tensorflow>=2.16,<2.21", "librosa>=0.10,<0.12", "scipy>=1.11,<2", "soundfile>=0.12,<1", "scikit-learn>=1.3,<2", "pandas>=2,<3", "matplotlib>=3.8,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
