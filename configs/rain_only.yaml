# Reproduces the single-carrier *method*, not necessarily the historical
# rain_phase artifact, which used a separate earlier trainer.
run_name: rain_only_general_trainer_v1
kind: carrier_aware
seed: 42
data_seed: 42
reshuffle_each_iteration: true
model: artifacts/models/keystroke_cnn.keras
dataset: artifacts/models/keystroke_dataset.npz
batch_size: 32
epochs: 80
steps_per_epoch: 12
learning_rate: 0.00001
rms_budget: 0.0012
peak_budget: 0.0024
init_mode: zero
output_dir: artifacts/runs
carriers: {rain: artifacts/carriers/rain.wav}
carrier_config:
  rain: {carrier_rms: 0.005, residual_gain: 1.0}
